services:
  - type: web
    name: tradenova-demo
    runtime: python
    plan: free
    buildCommand: "echo No dependencies required"
    startCommand: "python -u telegram-server.py"
    healthCheckPath: /health
    envVars:
      - key: TRADENOVA_HOST
        value: 0.0.0.0
      - key: TRADENOVA_BOT_TOKEN
        sync: false
      - key: TRADENOVA_ADMIN_IDS
        sync: false
