<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeNova | مدیریت سرور آزمایشی</title><style>body{font-family:Tahoma,Arial;background:#101a29;color:#edf4ff;padding:18px;max-width:850px;margin:auto}button{background:#25b7aa;border:0;border-radius:8px;padding:9px;margin:4px;cursor:pointer}article{background:#1d2c42;border-radius:12px;padding:14px;margin:12px 0}small{color:#b9c5d5}#error{color:#ffae9e}</style><h2>مدیریت سرور TradeNova — فقط آزمایشی</h2><p>این صفحه باید از داخل تلگرام باز شود و شناسهٔ شما در TRADENOVA_ADMIN_IDS ثبت شده باشد.</p><button onclick="load()">به‌روزرسانی</button><p id="error"></p><div id="users"></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const initData=window.Telegram?.WebApp?.initData||'';
const error=document.getElementById('error'),root=document.getElementById('users');
async function request(url,body){const res=await fetch(url,{method:body?'POST':'GET',headers:{'X-Telegram-Init-Data':initData,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(data.error||'HTTP '+res.status);return data}
async function load(){root.replaceChildren();error.textContent='';try{if(!initData)throw Error('صفحه را از داخل تلگرام باز کنید.');const data=await request('/api/admin/state');const summary=document.createElement('p');summary.textContent='کاربران: '+data.users.length+' | معاملات آزمایشی: '+data.total_trades;root.append(summary);for(const u of data.users){const row=document.createElement('article');const name=document.createElement('strong');name.textContent=u.name+' ('+u.id+')';row.append(name);const info=document.createElement('p');info.textContent='موجودی آزمایشی: '+u.balance+' USDT | ربات: '+(u.bot_enabled?'روشن':'خاموش')+' | اشتراک تا: '+(u.subscription_until?new Date(u.subscription_until*1000).toLocaleDateString('fa-IR'):'غیرفعال');row.append(info);for(const [action,label] of [['enable_bot','فعال‌کردن ربات'],['disable_bot','توقف ربات'],['activate_month','اشتراک آزمایشی ۳۰ روزه'],['disable_subscription','لغو اشتراک']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm('این تغییر برای کاربر '+u.id+' اعمال شود؟'))return;try{await request('/api/admin/action',{user_id:u.id,action});await load()}catch(e){error.textContent=e.message}};row.append(b)}root.append(row)}}catch(e){error.textContent=e.message}}
load();</script></html>
